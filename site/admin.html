<!doctype html>
<html lang="en" data-live>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dashboard | That's Just Good</title>
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#13294B">
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/images/brand/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Unbounded:wght@600;700;800&display=swap">
<link rel="stylesheet" href="/assets/style.css?v=4fa954773d">
<style>
  body { background: var(--paper); }
  .adm-top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 40; background: var(--band-ink); color: var(--band-ink-fg); }
  .adm-top .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 64px; }
  .adm-top img { height: 36px; width: auto; display: block; }
  .adm-top .who { display: flex; gap: 10px; align-items: center; font-size: .92rem; }
  .adm-top .btn.ghost { color: var(--band-ink-fg); }
  .adm-tabs { display: flex; gap: 4px; flex-wrap: wrap; padding-block: 10px; }
  .adm-tabs a { text-decoration: none; font-weight: 600; padding: 8px 14px; border-radius: 999px; color: var(--band-ink-fg); }
  .adm-tabs a[aria-current="page"] { background: var(--sky); color: var(--on-color); }
  .adm-main { padding-block: 28px 80px; }
  .adm-main h1 { font-size: clamp(1.6rem, 3.4vw, 2.4rem); text-transform: none; }
  .adm-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 14px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px 20px; display: grid; gap: 4px; }
  .kpi b { font-family: var(--font-display); font-weight: 800; font-size: 2.2rem; line-height: 1; font-variant-numeric: tabular-nums; }
  .kpi span { color: var(--muted); font-size: .93rem; }
  .row-actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .table tr[data-href] { cursor: pointer; }
  .table tr[data-href]:hover td { background: color-mix(in srgb, var(--sky) 12%, transparent); }
  .toggle-in { min-width: 108px; }
  .impact-row { display: grid; grid-template-columns: 120px minmax(0, 1fr) auto; gap: 8px; align-items: end; }
  .thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
  .thumbs img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; }
  .scanner video { width: 100%; max-width: 420px; border-radius: 14px; background: #000; }
  .big-search { font-size: 1.2rem !important; padding: 16px 18px !important; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--paper); padding: 12px 18px; border-radius: 999px; font-weight: 600; z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,.2); max-width: calc(100% - 32px); }
  .login { max-width: 440px; margin: 10vh auto 0; }
  .two { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 24px; align-items: start; }
  @media (max-width: 900px) { .two { grid-template-columns: 1fr; } }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: clamp(18px, 2.4vw, 26px); display: grid; gap: 14px; align-content: start; }
  .card h2 { font-size: 1.15rem; text-transform: none; }
  .muted-s { color: var(--muted); font-size: .9rem; }
</style>
</head>
<body>
<header class="adm-top"><div class="wrap">
  <div class="row"><a href="/admin" aria-label="Dashboard home"><img src="/images/brand/logo-horizontal-reversed.svg" alt="That's Just Good" width="200" height="36"></a><div class="who" id="who"></div></div>
  <nav class="adm-tabs" id="tabs" aria-label="Dashboard" hidden>
    <a href="#overview">Overview</a><a href="#events">Events</a><a href="#bookings">Bookings</a><a href="#leads">Leads</a><a href="#hub">Impact Hub</a><a href="#team">Team</a>
  </nav>
</div></header>
<main class="adm-main"><div class="wrap" id="view"><p class="app-loading">Loading…</p></div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js" defer></script>
<script type="module" src="/assets/admin.js?v=72306d8805"></script>
</body>
</html>
