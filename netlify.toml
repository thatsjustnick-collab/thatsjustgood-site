[build]
  publish = "site"
  functions = "netlify/functions"

# Old Wix URLs → new pages, so existing links and search results keep working
[[redirects]]
  from = "/our-story"
  to = "/about"
  status = 301

[[redirects]]
  from = "/connect"
  to = "/contact"
  status = 301

[[redirects]]
  from = "/consulting"
  to = "/team-building"
  status = 301

[[redirects]]
  from = "/shop"
  to = "/"
  status = 301

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/site.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"

# Events system: pretty links that load the right page
[[redirects]]
  from = "/events/:slug"
  to = "/event.html"
  status = 200

[[redirects]]
  from = "/rsvp/:token"
  to = "/rsvp.html"
  status = 200

[[redirects]]
  from = "/team/:code"
  to = "/team.html"
  status = 200

[[redirects]]
  from = "/report/:token"
  to = "/report.html"
  status = 200

[[redirects]]
  from = "/certificate/:token"
  to = "/certificate.html"
  status = 200

[[redirects]]
  from = "/checkin/:token"
  to = "/checkin.html"
  status = 200

[[redirects]]
  from = "/events"
  to = "/community#popup-list"
  status = 301
